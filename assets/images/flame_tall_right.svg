<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 620" fill="none">
  <defs>
    <filter id="flameGlowR" x="-20%" y="-10%" width="140%" height="120%">
      <feGaussianBlur stdDeviation="2.5" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Flipped horizontally for symmetrical right wing -->
  <g transform="translate(120, 0) scale(-1, 1)">
    <!-- Outer long continuous flame path rising from countdown level to head -->
    <path d="M 95 615 C 90 560, 50 515, 68 450 C 82 395, 38 350, 55 275 C 68 215, 25 165, 46 95 C 56 60, 48 30, 44 8 C 40 32, 28 68, 34 110 C 42 165, 12 215, 26 290 C 38 355, 8 415, 20 485 C 30 545, 12 580, 22 615" 
          stroke="#F5C542" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" filter="url(#flameGlowR)" />

    <!-- Inner upper tongue -->
    <path d="M 48 190 C 38 145, 50 110, 46 55 C 38 95, 28 130, 36 180 C 42 220, 26 260, 32 300" 
          stroke="#FFE58A" stroke-width="2" stroke-linecap="round" />

    <!-- Inner middle tongue -->
    <path d="M 68 390 C 60 345, 76 310, 64 250 C 52 290, 44 325, 52 375 C 58 415, 42 455, 50 495" 
          stroke="#FFE58A" stroke-width="2" stroke-linecap="round" />

    <!-- Inner lower tongue reaching countdown -->
    <path d="M 82 580 C 74 535, 90 500, 78 440 C 66 480, 58 515, 66 565 C 70 595, 56 608, 62 618" 
          stroke="#F7C531" stroke-width="2" stroke-linecap="round" />
  </g>
</svg>
