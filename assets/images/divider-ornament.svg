<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 40" fill="none" class="ornament-divider-svg">
  <!-- Left flourish line -->
  <path d="M10 20 H150" stroke="#E3A92B" stroke-width="1.5" stroke-linecap="round"/>
  <circle cx="20" cy="20" r="2.5" fill="#E3A92B"/>
  <circle cx="50" cy="20" r="1.5" fill="#F5C542"/>
  <circle cx="150" cy="20" r="3" fill="#E3A92B"/>

  <!-- Center floral / star emblem -->
  <g transform="translate(200, 20)">
    <!-- 4 pointed star -->
    <path d="M0 -15 Q0 -2 13 0 Q0 2 0 15 Q0 2 -13 0 Q0 -2 0 -15 Z" fill="#F5C542"/>
    <circle cx="0" cy="0" r="3.5" fill="#A3201A" stroke="#E3A92B" stroke-width="1.5"/>
    <!-- Outer decorative curls -->
    <path d="M-18 -8 C-25 -15 -35 -5 -25 5 C-18 12 -12 2 -20 -2" stroke="#E3A92B" stroke-width="1.2" fill="none"/>
    <path d="M18 -8 C25 -15 35 -5 25 5 C18 12 12 2 20 -2" stroke="#E3A92B" stroke-width="1.2" fill="none"/>
  </g>

  <!-- Right flourish line -->
  <path d="M250 20 H390" stroke="#E3A92B" stroke-width="1.5" stroke-linecap="round"/>
  <circle cx="250" cy="20" r="3" fill="#E3A92B"/>
  <circle cx="350" cy="20" r="1.5" fill="#F5C542"/>
  <circle cx="380" cy="20" r="2.5" fill="#E3A92B"/>
</svg>
